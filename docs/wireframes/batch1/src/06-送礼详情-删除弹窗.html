<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style-vars.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:375px;margin:0;background:#F6F6F6;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#333;font-size:15px;-webkit-font-smoothing:antialiased}
.page{width:375px;min-height:810px;background:#F6F6F6;position:relative;padding-bottom:76px}
.card{background:#fff;border-radius:12px;margin:12px}
.searchbar{display:flex;align-items:center;padding:10px 12px;gap:8px}
.searchbox{flex:1;background:#F2F2F2;border-radius:17px;height:34px;display:flex;align-items:center;padding:0 14px;color:#C2C2C2;font-size:14px}
.search-cancel{color:#F0575A;font-size:14px;white-space:nowrap}
.tip{display:flex;align-items:flex-start;gap:6px;padding:8px 14px;font-size:12px;color:#999;line-height:1.6}
.tip .horn{font-size:14px}
.row{display:flex;align-items:center;padding:0 16px;height:58px;border-bottom:1px solid #F0F0F0}
.row:last-child{border-bottom:none}
.form-label{width:82px;flex:none;font-size:15px;color:#333}
.form-val{flex:1;text-align:left;font-size:15px;color:#333}
.form-val.ph{color:#C2C2C2}
.chev{color:#C2C2C2;font-size:18px}
.mask{position:absolute;left:0;top:0;width:375px;height:100%;background:rgba(0,0,0,.45);z-index:20}
.dialog{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:300px;background:#fff;border-radius:12px;z-index:21;overflow:hidden}
.dialog .dinfo{padding:20px 20px 6px;font-size:14px;color:#555;line-height:1.9}
.dialog .dinfo b{color:#333}
.dialog .dwarn{text-align:center;font-size:14px;color:#333;padding:10px 20px 16px;font-weight:500}
.dialog .dbtns{display:flex;border-top:1px solid #F0F0F0}
.dialog .dbtns div{flex:1;text-align:center;padding:14px 0;font-size:15px;height:58px;line-height:30px}
.dialog .dcancel{color:#666;border-right:1px solid #F0F0F0}
.dialog .ddel{color:#F0575A;font-weight:600}
.sheet-mask{position:absolute;left:0;top:0;width:375px;height:100%;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:absolute;left:0;bottom:0;width:375px;background:#fff;border-radius:16px 16px 0 0;z-index:21;padding-bottom:20px}
.sheet .sname{text-align:center;font-size:17px;font-weight:600;padding:18px 0 6px;font-family:"Songti SC","STSong",serif}
.sheet .sopt{text-align:center;height:58px;line-height:58px;font-size:15px;border-top:2px solid #F4F4F4}
.sheet .sopt.red{color:#F0575A}
.sheet .sopt .sub{font-size:12px;color:#C2C2C2;margin-left:8px}
</style></head><body><div class="page"><div class="wf-titlebar"><span class="back">‹</span>送礼详情<span class="capsule"></span></div>
<div class="card" style="text-align:center;padding:24px 0 14px">
  <div style="width:72px;height:72px;border-radius:50%;background:var(--tag-selected-bg);margin:0 auto;display:flex;align-items:center;justify-content:center"><img src="icons/01-jiehun.svg" style="width:52px;height:52px"></div>
  <div class="wf-tagname" style="font-size:14px;color:#E05353;font-weight:700;margin-top:8px">结婚</div>
</div>
<div class="card">
  <div class="row"><div class="form-label">日期</div><div class="form-val">2026-10-02</div></div>
  <div class="row"><div class="form-label">姓名</div><div class="form-val">张三</div></div>
  <div class="row"><div class="form-label">金额</div><div class="form-val" style="font-weight:600">-1000.00</div></div>
  <div class="row"><div class="form-label">备注</div><div class="form-val ph">无</div></div>
</div>
<div style="text-align:center;position:absolute;left:0;right:0;bottom:112px;color:#F0575A;font-size:15px">查看往来记录＞＞＞</div>
<div style="position:absolute;left:0;right:0;bottom:26px;display:flex;gap:12px;padding:0 24px">
  <div style="flex:1;height:56px;line-height:56px;border-radius:28px;background:#F2F2F2;color:#F0575A;text-align:center;font-size:17px;font-weight:600">删除</div>
  <div style="flex:1;height:56px;line-height:56px;border-radius:28px;background:#F0575A;color:#fff;text-align:center;font-size:17px;font-weight:600">修改</div>
</div>

<div class="mask"></div>
<div class="dialog">
  <div class="dinfo" style="text-align:center">张三 · 结婚 · <b>1000.00</b></div>
  <div class="dwarn">删除后无法恢复，确定要删除吗？</div>
  <div class="dbtns"><div class="dcancel">取消</div><div class="ddel">删除</div></div>
</div>
</div></body></html>
