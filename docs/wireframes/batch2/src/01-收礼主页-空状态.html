<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style-vars.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:375px;margin:0;background:#F6F6F6;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#333;font-size:15px;-webkit-font-smoothing:antialiased}
.page{width:375px;min-height:810px;background:#F6F6F6;position:relative;padding-bottom:76px}
.horn{display:flex;align-items:center;background:#FFF8E1;border-radius:8px;margin:12px 12px 0;padding:8px 10px}
.horn .hi{font-size:14px;margin-right:6px;flex:none}
.horn .hs{flex:1;overflow:hidden;white-space:nowrap}
.horn .ht{display:inline-block;font-size:12px;color:#E8912D;animation:hscroll 9s linear infinite}
@keyframes hscroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.horn .hx{color:#E8912D;font-size:18px;padding:0 2px 0 8px;flex:none}
.total-line{font-size:12px;color:#C2C2C2;padding:10px 16px 0}
.total-line .tn{color:#E05353;font-weight:600}
.empty{text-align:center;padding-top:90px}
.empty .eicon{font-size:72px;opacity:.45;display:block}
.empty .etxt{color:#C2C2C2;font-size:14px;margin-top:18px;display:block}
.empty .esample{color:#F0575A;font-size:14px;margin-top:14px;display:block}
.tabbar{position:absolute;left:0;bottom:0;width:375px;height:62px;display:flex;border-top:1px solid #F0F0F0;background:#fff;z-index:10}
.tab{flex:1;text-align:center;font-size:11px;color:#999;padding-top:9px;line-height:1.5}
.tab .ti{width:24px;height:24px;display:block;margin:0 auto 3px}
.tab.active{color:#F0575A}
</style></head><body><div class="page">
<div class="wf-titlebar"><span class="back">‹</span>收礼礼簿<span class="capsule"></span></div>
<div class="horn"><span class="hi"><svg width="14" height="14" viewBox="0 0 48 48" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v12h8l10 8V10L18 18h-8z"/>
  <path d="M34 20a8 8 0 0 1 0 8"/>
  <path d="M38 15a14 14 0 0 1 0 18"/></svg></span><span class="hs"><span class="ht">点击礼簿查看收礼记录，从右往左滑动可以修改、删除礼簿~</span></span><span class="hx">×</span></div>
<div class="total-line">共计：0本 <span class="tn wf-num">￥0.00</span></div>
<div class="empty"><span class="eicon"><svg width="72" height="72" viewBox="0 0 48 48" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14a4 4 0 0 1 4-4h8l4 6h12a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V14z"/></svg></span><span class="etxt">还没有礼薄，点击下方红色＋按钮添加</span><span class="esample">点击查看示例</span></div><div class="wf-fab">＋</div><div class="tabbar"><div class="tab active"><img class="ti" src="tabbar/home-active.png">首页</div><div class="tab"><img class="ti" src="tabbar/wanglai.png">往来</div><div class="tab"><img class="ti" src="tabbar/contacts.png">亲友录</div><div class="tab"><img class="ti" src="tabbar/mine.png">我的</div></div></div></body></html>
