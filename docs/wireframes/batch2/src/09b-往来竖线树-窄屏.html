<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style-vars.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:375px;margin:0;background:#fff;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#333;font-size:15px;-webkit-font-smoothing:antialiased}
.page{width:375px;background:#fff;position:relative}
/* v3.1 14.2：标题白底黑字，无搜索框 */
.titlebar{background:#fff;color:#111;text-align:center;font-size:17px;font-weight:600;padding:14px 44px;position:relative;border-bottom:1px solid #F0F0F0;font-family:var(--font-songti)}
.titlebar .back{position:absolute;left:12px;top:12px;font-size:20px;color:#333;font-family:-apple-system,"PingFang SC",sans-serif}
/* 标题下淡金色栏：左送出/右收到，白字 */
.kindbar{display:flex;background:#CEA64F;color:#fff;font-size:15px;font-weight:600}
.kindbar div{flex:1;text-align:center;padding:10px 0}
/* 双栏时间线 */
.tl{position:relative;padding:14px 0 4px}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#D9C9A8;transform:translateX(-50%)}
.trow{position:relative;display:flex;min-height:58px;padding:7px 0}
.tcell{flex:1;padding:0 14px}
.tcell.left{text-align:right}
.tcell.right{text-align:left}
.trow::after{content:"";position:absolute;left:50%;top:24px;width:10px;height:10px;border-radius:50%;background:#E05353;transform:translateX(-50%);z-index:1}
.tdate{display:block;font-size:12px;color:#999;margin-bottom:2px}
.treason{display:block;font-size:14px;color:#333;font-family:var(--font-songti)}
.tamt{display:block;font-size:15px;font-weight:700;color:#111;margin-top:2px}
.pen{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-left:6px}
/* 底部汇总：淡黄底，紧跟时间线，不悬浮，居中三行 */
.sumbar{background:#FDF6E3;text-align:center;padding:12px 0 16px;font-size:15px;line-height:2;color:#333}
.sumbar .dl{color:#E05353;font-weight:700}
</style></head><body><div class="page">

<div class="sumbar"><div class="wf-num">送出：¥2900.00</div><div class="wf-num">收到：¥3000.00</div><div class="wf-num"><span class="dl">差额：</span>¥100.00</div></div>
</div></body></html>
