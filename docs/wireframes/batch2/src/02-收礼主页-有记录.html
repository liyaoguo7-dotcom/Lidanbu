<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style-vars.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:375px;margin:0;background:#F6F6F6;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#333;font-size:15px;-webkit-font-smoothing:antialiased}
.page{width:375px;min-height:810px;background:#F6F6F6;position:relative;padding-bottom:76px}
.horn{display:flex;align-items:center;background:#FFF8E1;border-radius:8px;margin:12px 12px 0;padding:8px 10px}
.horn .hi{font-size:14px;margin-right:6px;flex:none}
.horn .hs{flex:1;overflow:hidden;white-space:nowrap}
.horn .ht{display:inline-block;font-size:12px;color:#E8912D;animation:hscroll 9s linear infinite}
@keyframes hscroll{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
.horn .hx{color:#E8912D;font-size:18px;padding:0 2px 0 8px;flex:none}
.total-line{font-size:12px;color:#C2C2C2;padding:10px 16px 0}
.total-line .tn{color:#E05353;font-weight:600}
.list{margin:8px 12px 12px;background:#fff;border-radius:12px;overflow:hidden}
.row{position:relative;border-bottom:1px solid #F0F0F0}
.row:last-child{border-bottom:none}
.swipe-bg{position:absolute;right:0;top:0;bottom:0;display:flex}
.swipe-bg div{width:60px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.rowfg{position:relative;background:#fff;display:flex;align-items:center;padding:12px 16px;min-height:68px}
.pat{width:44px;height:44px;border-radius:50%;background:#F5F6F4;display:flex;align-items:center;justify-content:center;flex:none}
.pat.baishi{background:#E8EAED}
.pat img{width:30px;height:30px}
.mid{flex:1;margin-left:12px;min-width:0}
.nm{font-size:16px;font-weight:600;font-family:var(--font-songti)}
.dt{font-size:12px;color:#C2C2C2;margin-left:8px}
.line2{margin-top:3px;font-size:12px;color:#C2C2C2}
.line2 .amt{color:#E05353;font-weight:600;font-size:14px}
.more{font-size:20px;color:#C2C2C2;padding:8px 0 8px 12px;letter-spacing:1px;flex:none}
.tabbar{position:absolute;left:0;bottom:0;width:375px;height:62px;display:flex;border-top:1px solid #F0F0F0;background:#fff;z-index:10}
.tab{flex:1;text-align:center;font-size:11px;color:#999;padding-top:9px;line-height:1.5}
.tab .ti{width:24px;height:24px;display:block;margin:0 auto 3px}
.tab.active{color:#F0575A}
</style></head><body><div class="page">
<div class="wf-titlebar"><span class="back">‹</span>收礼礼簿<span class="capsule"></span></div>
<div class="horn"><span class="hi"><svg width="14" height="14" viewBox="0 0 48 48" fill="none" stroke="#555" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 18v12h8l10 8V10L18 18h-8z"/>
  <path d="M34 20a8 8 0 0 1 0 8"/>
  <path d="M38 15a14 14 0 0 1 0 18"/></svg></span><span class="hs"><span class="ht">点击礼簿查看收礼记录，从右往左滑动可以修改、删除礼簿~</span></span><span class="hx">×</span></div>
<div class="total-line">共计：3本 <span class="tn wf-num">￥8800</span></div>
<div class="list">
<div class="row"><div class="rowfg"><div class="pat"><img src="icons/01-jiehun.svg"></div><div class="mid"><div><span class="nm">张三＆李四 婚礼</span><span class="dt wf-num">2026-10-02</span></div><div class="line2">共25笔 ｜ <span class="amt wf-num">￥6000</span></div></div><div class="more">⋯</div></div></div>
<div class="row"><div class="swipe-bg"><div style="background:#C2C2C2">修改</div><div style="background:#F0575A">删除</div></div><div class="rowfg" style="transform:translateX(-120px)"><div class="pat"><img src="icons/05-shengri.svg"></div><div class="mid"><div><span class="nm">王五 生日宴</span><span class="dt wf-num">2026-09-18</span></div><div class="line2">共12笔 ｜ <span class="amt wf-num">￥1800</span></div></div><div class="more">⋯</div></div></div>
<div class="row"><div class="rowfg"><div class="pat baishi"><img src="icons/09-baishi.svg"></div><div class="mid"><div><span class="nm">赵老先生 丧事</span><span class="dt wf-num">2026-08-30</span></div><div class="line2">共8笔 ｜ <span class="amt wf-num">￥1000</span></div></div><div class="more">⋯</div></div></div>
</div>
<div class="wf-fab">＋</div><div class="tabbar"><div class="tab active"><img class="ti" src="tabbar/home-active.png">首页</div><div class="tab"><img class="ti" src="tabbar/wanglai.png">往来</div><div class="tab"><img class="ti" src="tabbar/contacts.png">亲友录</div><div class="tab"><img class="ti" src="tabbar/mine.png">我的</div></div></div></body></html>
