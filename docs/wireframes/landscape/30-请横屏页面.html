<!DOCTYPE html><html><head><meta charset='utf-8'><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:375px;height:812px;font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;background:#F6F6F6;position:relative;overflow:hidden}
.navbar{height:88px;background:#F0E6D4;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px}
.navbar .back{position:absolute;left:16px;bottom:10px;font-size:25px;line-height:1;color:#333333}

.center{margin-top:148px;text-align:center;padding:0 40px}
.main{font-size:18px;font-weight:bold;color:#333333;margin-top:32px;line-height:1.5}
.sub{font-size:13px;color:#999999;margin-top:14px}
.lock{font-size:13px;color:#999999;margin-top:6px;line-height:1.6}
.btnwrap{position:absolute;bottom:96px;left:0;right:0;text-align:center}
.vbtn{display:inline-block;padding:12px 36px;border:1px solid #C9BFA9;border-radius:24px;color:#8A7B5C;font-size:15px;background:rgba(255,255,255,0.6)}
</style></head><body>
<div class='navbar'><div class='back'>‹</div><div class='ttl'>横置礼单本</div></div>
<div class='center'><svg width='128' height='128' viewBox='0 0 128 128' xmlns='http://www.w3.org/2000/svg'>
<g fill='none' stroke='#8A8578' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'>
<rect x='58' y='52' width='56' height='34' rx='7' stroke-opacity='0.4' stroke-dasharray='5 5'/>
<rect x='34' y='18' width='42' height='72' rx='8'/>
<line x1='49' y1='79' x2='61' y2='79'/>
<path d='M84 22 A40 40 0 0 1 106 44'/>
<path d='M107 32 L107 46 L94 45'/>
</g></svg>
<div class='main'>请把手机横过来，礼单本就会铺开啦</div>
<div class='sub'>横置礼单本仅支持横屏使用</div>
<div class='lock'>没有反应？请先在手机控制中心关闭"竖屏锁定"</div>
</div>
<div class='btnwrap'><div class='vbtn'>切换回竖置样式</div></div>
</body></html>
