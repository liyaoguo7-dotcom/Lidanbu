<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:390px;height:844px;overflow:hidden;background:#FAF5EC;font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;position:relative;color:#6B543E}
.frame{position:absolute;inset:18px;border:1px solid #D8C7AC;pointer-events:none}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:96px 52px 64px}
.en{font-family:Georgia,'Times New Roman',serif;font-size:12px;letter-spacing:6px;text-indent:6px;color:#A68B6B}
.sprig{margin-top:26px}
.names{margin-top:34px;font-size:34px;letter-spacing:4px;color:#54402A;font-weight:normal}
.names .amp{font-family:Georgia,serif;font-style:italic;font-size:24px;color:#B99B6B;margin:0 8px}
.event{margin-top:14px;font-size:15px;letter-spacing:14px;text-indent:14px;color:#8A6D4F}
.rule{width:56px;height:1px;background:#C9B48C;margin:38px 0}
.bless{font-size:14px;line-height:2.2;color:#8A7358;text-align:center;letter-spacing:1px}
.info{margin-top:40px;text-align:center;line-height:2.3;font-size:14.5px;color:#6B543E}
.info .big{font-size:17px;color:#54402A;letter-spacing:1px}
.info .sub{font-size:12.5px;color:#A68B6B}
.pin{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#A68B6B;font-size:12px;letter-spacing:2px}
.host{margin-top:30px;font-size:13.5px;letter-spacing:3px;color:#8A6D4F}
.btn{margin-top:auto;width:210px;height:44px;border:1px solid #B99B6B;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:5px;text-indent:5px;color:#8A6D4F;background:transparent}
.vb{white-space:nowrap;font-size:16.5px !important;letter-spacing:0 !important;margin-top:6px}
</style></head><body>
<div class="frame"></div>
<div class="wrap">
  <div class="en">WEDDING&nbsp;INVITATION</div>
  <svg class="sprig" width="46" height="70" viewBox="0 0 34 52"><g fill="none" stroke="#B99B6B" stroke-width="1.4"><path d="M17,50 C17,34 17,20 17,6"/><path d="M17,32 C10,30 6,25 5,18 C12,19 16,24 17,32Z"/><path d="M17,32 C24,30 28,25 29,18 C22,19 18,24 17,32Z"/><path d="M17,20 C12,17 10,13 10,8 C15,10 17,14 17,20Z"/><path d="M17,20 C22,17 24,13 24,8 C19,10 17,14 17,20Z"/></g></svg>
  <div class="names">张三<span class="amp">&</span>李四</div>
  <div class="event">结婚典礼</div>
  <div class="rule"></div>
  <div class="bless">诚邀您携家人一起<br>见证我们的幸福时刻</div>
  <div class="info">
    <div class="big">2026年11月8日 星期日</div>
    <div>午宴 12:00 恭候 · 12:30 入席</div>
    <div class="big vb">义乌市幸福里国际酒店 · 三楼宴会厅</div>
    <div class="sub">义乌市江东街道幸福路 88 号</div>
  </div>
  <div class="pin">
    <svg width="18" height="22" viewBox="0 0 18 22"><path d="M9,21 C9,21 2,13.5 2,8.5 A7,7 0 1,1 16,8.5 C16,13.5 9,21 9,21Z" fill="none" stroke="#B99B6B" stroke-width="1.4"/><circle cx="9" cy="8.5" r="2.6" fill="none" stroke="#B99B6B" stroke-width="1.4"/></svg>
    <span>点击查看地图</span>
  </div>
  <div class="host">张建国 · 王秀英 敬邀</div>
  <div class="btn">填写回执</div>
</div>
</body></html>
