<!DOCTYPE html><html><head><meta charset="utf-8"><style>
/* 引导图3 · 往来竖线树（静态复刻）
   数据口径（2026-10-25 用户定）：与亲友「周小梅」的往来，全图共 3 条；送礼用标签；
   收礼条目不出现人名、用亲人称谓的事件命名（女儿的升学宴）；金额只用 1000/2000。
   顺序与真实页面一致：core/stats 按日期从早到晚。金额：条目无 ¥ 前缀、
   送出负号/收到正号、两位小数（formatAmount）；底部汇总带 ¥ 两位小数，
   差额 = |收到 − 送出|。版式按 pages/timeline 的 wxml/wxss（rpx 按 390/750 换算）。 */
* { margin:0; padding:0; box-sizing:border-box; }
body { width:390px; height:818px; overflow:hidden; position:relative; background:#fff; font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; color:#333; font-size:15px; }
.nav { background:#FFFFFF; height:88px; position:relative; }
.nav .title { position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:17px; font-weight:bold; font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
.nav .back { position:absolute; left:14px; bottom:12px; font-size:20px; color:#333; }
.nav .capsule { position:absolute; right:8px; bottom:8px; width:82px; height:30px; border:1px solid rgba(0,0,0,.15); border-radius:15px; background:rgba(255,255,255,.6); display:flex; align-items:center; justify-content:space-around; color:#333; font-size:13px; }
.songti { font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; } /* 与真实页面同口径：全站黑体、无宋体（AA 清零后复刻同步） */
.kindbar { display:flex; background:#CEA64F; color:#fff; font-size:16px; font-weight:600; }
.kind-half { flex:1; text-align:center; padding:10px 0; }
.tl { position:relative; background:#fff; padding:19px 0 6px; }
.tl-line { position:absolute; left:50%; top:0; bottom:0; width:2px; background:#D9C9A8; transform:translateX(-50%); }
.trow { position:relative; display:flex; min-height:67px; padding:8px 0; }
.tcell { flex:1; padding:0 15px; }
.tcell.left { text-align:right; }
.tcell.right { text-align:left; }
.tdot { position:absolute; left:50%; top:27px; width:10px; height:10px; border-radius:50%; background:#E05353; transform:translateX(-50%); z-index:1; }
.tdate { font-size:12px; color:#999; margin-bottom:3px; }
.treason { font-size:15px; color:#333; }
.tpen { width:15px; height:15px; vertical-align:-2px; margin-left:3px; }
.tamt { font-size:16px; font-weight:700; color:#111; margin-top:3px; }
.sumbar { background:#FDF6E3; text-align:center; padding:15px 0 19px; font-size:16px; line-height:2; color:#333; }
.sumbar .dl { color:#E05353; font-weight:700; }
</style></head><body>
<div class="nav"><div class="back">‹</div><div class="title">往来记录 - 周小梅</div><div class="capsule"><span>•••</span><span style="border-left:1px solid rgba(0,0,0,.15);padding-left:10px">◉</span></div></div>

  <div class="trow"><div class="tcell left"></div><div class="tdot"></div><div class="tcell right"><div class="tdate">2025-09-12</div><div class="treason songti">女儿的升学宴<img class="tpen" src="../../../miniprogram/images/icons/pen.svg"></div><div class="tamt">+1000.00</div></div></div>
  <div class="trow"><div class="tcell left"><div class="tdate">2026-03-08</div><div class="treason songti">生日<img class="tpen" src="../../../miniprogram/images/icons/pen.svg"></div><div class="tamt">-1000.00</div></div><div class="tdot"></div><div class="tcell right"></div></div>
</div>

<div class="sumbar">
  <div>送出：¥2000.00</div>

  <div><span class="dl">差额：</span>¥1000.00</div>
</div>
</body></html>
