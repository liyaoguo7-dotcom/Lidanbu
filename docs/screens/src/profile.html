<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:375px; background:#F6F6F6; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#333; font-size:15px; padding-bottom:16px; }
.nav { background:#F0E6D4; height:88px; position:relative; }
.nav .back { position:absolute; left:14px; bottom:12px; font-size:22px; color:#333; }
.nav .title { position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:17px; font-weight:bold; font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif; }
.nav .capsule { position:absolute; right:8px; bottom:8px; width:82px; height:30px; border:1px solid rgba(0,0,0,.15); border-radius:15px; background:rgba(255,255,255,.6); display:flex; align-items:center; justify-content:space-around; color:#333; font-size:13px; }
.card { background:#FFF; border-radius:12px; margin:12px; }
.avatar-btn { display:flex; flex-direction:column; align-items:center; padding:20px 16px; }
.avatar-ph { width:72px; height:72px; border-radius:50%; background:#F1E6D3; color:#8A6D3B; font-size:20px; font-weight:600; display:flex; align-items:center; justify-content:center; }
.avatar-hint { font-size:12px; color:#C2C2C2; margin-top:8px; }
.form-row { display:flex; align-items:center; padding:0 16px; min-height:58px; border-bottom:1px solid #F0F0F0; }
.form-row:last-child { border-bottom:none; }
.form-label { width:82px; flex:none; font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif; }
.form-val { flex:1; }
.count-hint { font-size:11px; color:#C2C2C2; padding:0 16px 10px 98px; line-height:1.6; }
.btn-primary { display:block; height:56px; line-height:56px; background:#F0575A; color:#fff; text-align:center; font-size:17px; border-radius:28px; margin:18px 24px 0; }
</style></head><body>
<div class="nav"><span class="back">‹</span><div class="title">个人资料</div><div class="capsule"><span>•••</span><span style="border-left:1px solid rgba(0,0,0,.15);padding-left:10px">◉</span></div></div>

<div class="card">
  <div class="avatar-btn">
    <div class="avatar-ph">阿</div>
    <div class="avatar-hint">点击更换头像</div>
  </div>
</div>

<div class="card">
  <div class="form-row"><span class="form-label">昵称</span><span class="form-val">阿明</span></div>
  <div class="count-hint">2/16（不填就显示「微信用户」；家人看到你记的账时，显示的就是这个昵称）</div>
  <div class="form-row"><span class="form-label">会员状态</span><span class="form-val">会员</span></div>
</div>

<div class="btn-primary">保存</div>
</body></html>
