<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }

.stat-label { font-size:13px; color:#999; margin-top:6px; }
.mask { font-family:monospace; font-size:13px; color:#666; }
.pill { display:inline-block; font-size:12px; border:1px solid #E0E0E0; border-radius:14px; padding:4px 12px; margin:4px 6px 4px 0; color:#666; }
.pill.on { background:#F0575A; color:#fff; border-color:#F0575A; }
.pill.danger { color:#C0392B; border-color:#C0392B; }
.row-between { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; }
.btn-primary { background:#F0575A; color:#fff; border-radius:28px; margin:12px; padding:13px 0; text-align:center; font-size:15px; }
.btn-danger { background:#C0392B; color:#fff; border-radius:28px; margin:12px 12px 0; padding:13px 0; text-align:center; font-size:15px; }
.btn-ghost { background:#fff; color:#333; border:1px solid #DDD; border-radius:28px; margin:8px 12px 12px; padding:13px 0; text-align:center; font-size:15px; }
.fb-content { font-size:14px; color:#333; line-height:1.6; padding:4px 16px 8px; }
.ph { color:#C2C2C2; }
.sw { width:48px; height:28px; border-radius:14px; background:#07C160; position:relative; flex:none; }
.sw::after { content:""; position:absolute; right:2px; top:2px; width:24px; height:24px; border-radius:50%; background:#fff; }
.sw.off { background:#E0E0E0; } .sw.off::after { right:auto; left:2px; }
.chk { width:20px; height:20px; border-radius:50%; background:#F0575A; color:#fff; font-size:13px; text-align:center; line-height:20px; flex:none; }
.chk.off { background:#fff; border:1px solid #CCC; color:#fff; }
.del { color:#C0392B; font-size:13px; padding:8px 16px; }
.add { color:#F0575A; font-size:14px; padding:10px 16px; }
</style></head><body>
