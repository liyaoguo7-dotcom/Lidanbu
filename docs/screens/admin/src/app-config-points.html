<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:375px; background:#F6F6F6; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#333; font-size:15px; padding-bottom:16px; }
.nav { background:#F0E6D4; height:88px; position:relative; }
.nav .back { position:absolute; left:14px; bottom:12px; font-size:22px; color:#333; }
.nav .title { position:absolute; left:0; right:0; bottom:14px; text-align:center; font-size:17px; font-weight:bold; font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif; }
.nav .capsule { position:absolute; right:8px; bottom:8px; width:82px; height:30px; border:1px solid rgba(0,0,0,.15); border-radius:15px; background:rgba(255,255,255,.6); display:flex; align-items:center; justify-content:space-around; color:#333; font-size:13px; }
.card { background:#FFF; border-radius:12px; margin:12px; }
.form-row { display:flex; align-items:center; padding:0 16px; min-height:58px; border-bottom:1px solid #F0F0F0; }
.form-row:last-child { border-bottom:none; }
.form-label { width:82px; flex:none; font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif; }
.form-label.w { width:190px; }
.form-val { flex:1; }
.note { font-size:13px; color:#999; margin:12px 16px; line-height:1.6; }
.warn-banner { background:#FFF7E6; border:1px solid #F5DFA8; color:#8A6D1B; font-size:14px; border-radius:12px; margin:12px; padding:14px 16px; line-height:1.6; }
.btn-primary { background:#F0575A; color:#fff; border-radius:28px; margin:12px; padding:13px 0; text-align:center; font-size:15px; }
.del { color:#C0392B; font-size:13px; padding:8px 16px; }
.add { color:#F0575A; font-size:14px; padding:10px 16px; }
.sw { width:48px; height:28px; border-radius:14px; background:#07C160; position:relative; flex:none; }
.sw::after { content:""; position:absolute; right:2px; top:2px; width:24px; height:24px; border-radius:50%; background:#fff; }
</style></head><body>
<div class="nav"><span class="back">‹</span><div class="title">会员与积分配置</div><div class="capsule"><span>•••</span><span style="border-left:1px solid rgba(0,0,0,.15);padding-left:10px">◉</span></div></div>
<div class="warn-banner">在本页改、保存即生效，每次修改都记入操作记录。积分数字全部从这里读，购买页不写死。</div>
<div class="card">
  <div class="form-row"><span class="form-val" style="font-weight:bold">积分规则</span></div>
  <div class="form-row"><span class="form-label w">新用户注册赠送（分）</span><span class="form-val">15</span></div>
  <div class="form-row"><span class="form-label w">拍照录入单价（分/次）</span><span class="form-val">5</span></div>
</div>
<div class="card">
  <div class="form-row"><span class="form-val" style="font-weight:bold">积分礼包（仅会员可买）</span></div>
  <div class="form-row"><span class="form-label">名称</span><span class="form-val">积分包</span></div>
  <div class="form-row"><span class="form-label">价格（元）</span><span class="form-val">5.00</span></div>
  <div class="form-row"><span class="form-label">积分</span><span class="form-val">5</span></div>
  <div class="del">删除这个礼包</div>
  <div class="add">＋ 添加礼包</div>
</div>
<div class="btn-primary">保存积分规则</div>
<div class="note">积分不过期；改单价/赠送只影响之后的新订单与新注册，历史流水不变。</div>
<div class="card">
  <div class="form-row"><span class="form-val" style="font-weight:bold">支付平台开关</span></div>
  <div class="form-row"><span class="form-label w">iPhone（iOS）购买入口</span><span class="sw"></span></div>
  <div class="form-row"><span class="form-label w">安卓（Android）购买入口</span><span class="sw"></span></div>
</div>
<div class="btn-primary">保存平台开关</div>
<div class="note">关掉某个终端后，该终端的购买页只显示提示、不出现购买按钮；改开关不用改任何页面代码。</div>
</body></html>
